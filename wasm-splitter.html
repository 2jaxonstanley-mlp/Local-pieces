<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wasm splitter</title>
<style>
body{font:16px system-ui,sans-serif;margin:0;padding:16px;background:#12181b;color:#eaf6fa;max-width:520px;margin-inline:auto}
h1{font-size:1.2rem;margin:.2rem 0 .6rem}p{color:#a9c4cc;line-height:1.4}
input,button{font:inherit;width:100%;box-sizing:border-box;margin:.3rem 0;padding:.7rem;border-radius:10px;border:1.5px solid #2c6b7c;background:#1a2a30;color:#eaf6fa}
button{background:#0f8aa6;border-color:#5fd8f0;font-weight:700}button.done{background:#245a38;border-color:#6fd08c}
#out{margin-top:.6rem}.m{font-size:.9rem;color:#8fd3e8}
</style></head><body>
<h1>Split stockfish-full.wasm</h1>
<p>Pick the big file. It is cut into pieces under 25 MB, named <b>sf-full-1.bin</b>, <b>sf-full-2.bin</b> and so on. Save every piece, then upload them all to GitHub next to index.html. Nothing leaves your phone.</p>
<input type="file" id="f">
<div id="info" class="m"></div>
<div id="out"></div>
<script>
const SIZE = 24000000;   // a little under 25 MB, in case the limit is counted in either way
const f = document.getElementById('f'), out = document.getElementById('out'), info = document.getElementById('info');
f.onchange = () => {
  out.innerHTML = '';
  const file = f.files[0];
  if (!file) return;
  const n = Math.ceil(file.size / SIZE);
  info.textContent = file.name + ': ' + (file.size / 1e6).toFixed(1) + ' MB, so ' + n + ' pieces.';
  for (let k = 0; k < n; k++) {
    const b = document.createElement('button');
    b.textContent = 'Save sf-full-' + (k + 1) + '.bin  (' + (Math.min(SIZE, file.size - k * SIZE) / 1e6).toFixed(1) + ' MB)';
    b.onclick = () => {
      const url = URL.createObjectURL(file.slice(k * SIZE, Math.min(file.size, (k + 1) * SIZE), 'application/octet-stream'));
      const a = document.createElement('a');
      a.href = url; a.download = 'sf-full-' + (k + 1) + '.bin';
      document.body.appendChild(a); a.click(); a.remove();
      b.classList.add('done'); b.textContent += ' - saved';
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    };
    out.appendChild(b);
  }
};
</script></body></html>
